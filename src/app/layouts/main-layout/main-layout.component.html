<mat-sidenav-container class="sidenav-container">
  <mat-sidenav
    #sidenav
    mode="side"
    opened
    class="sidenav"
    [class.sidenav-collapsed]="isHandset"
  >
    <div class="sidenav-header">
      <h2>Consultores</h2>
    </div>
    <mat-nav-list>
      <a mat-list-item routerLink="/consultores" routerLinkActive="active">
        <mat-icon>people</mat-icon>
        <span>Consultores</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar color="primary">
      <button mat-icon-button (click)="sidenav.toggle()" *ngIf="isHandset">
        <mat-icon>menu</mat-icon>
      </button>
      <span class="toolbar-title">Gerenciamento de Consultores</span>
      <span class="spacer"></span>
      <div *ngIf="currentUser">
        <button mat-icon-button [matMenuTriggerFor]="userMenu">
          <mat-icon>account_circle</mat-icon>
        </button>
        <mat-menu #userMenu="matMenu">
          <div class="user-info">
            <p>{{ currentUser.email }}</p>
          </div>
          <mat-divider></mat-divider>
          <button mat-menu-item (click)="logout()">
            <mat-icon>logout</mat-icon>
            <span>Sair</span>
          </button>
        </mat-menu>
      </div>
    </mat-toolbar>

    <div class="content">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
